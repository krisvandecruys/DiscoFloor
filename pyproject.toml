[project]
name = "discofloor"
version = "0.2.0"
description = "Python configuration and live pad colors for the M-Vave SMC PAD Pocket"
readme = "README.md"
authors = [{ name = "Kris Vandecruys" }]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["midi", "sysex", "m-vave", "pad-controller"]
dependencies = []

[project.optional-dependencies]
midi = ["mido>=1.3.2,<2", "python-rtmidi>=1.5,<2"]

[project.scripts]
discofloor = "discofloor.commands:main"

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.1", "mido>=1.3.2,<2"]
midi = ["mido>=1.3.2,<2", "python-rtmidi>=1.5,<2"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ty.src]
include = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
default-groups = ["dev", "midi"]
