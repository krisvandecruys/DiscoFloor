# macOS / Microsoft PowerPoint: start a slide show before tapping pads.
# Captured from preset 3, bank 3, channel 10; this file does not configure pads.
# Purple = previous; yellow = next. Update notes if your mapping changes.
# Preview: uv run discofloor launcher --config examples/powerpoint.toml --dry-run
# Run:     uv run discofloor launcher --config examples/powerpoint.toml
# cwd is relative to this TOML, so the companion script resolves reliably.
# Stop the Hammerspoon MidiMapper first to avoid duplicate arrow-key actions.

# Pad 1: purple — previous slide
[[binding]]
note = 32
channel = 10
event = "note-on"
min_velocity = 96
cooldown = 0.25
cwd = "."
command = ["/usr/bin/osascript", "powerpoint.applescript", "previous"]

